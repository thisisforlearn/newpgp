name: Android APK

# v0.1.4 pipeline note:
#   The keyboard ships (a) real Rust/OpenPGP crypto built with cargo-ndk into
#   android/keyboard/app/src/main/jniLibs and (b) a bundled, quantized LiteRT
#   (.tflite) grammar model generated by tools/convert_grammar_model.py into
#   android/keyboard/app/src/main/assets/models. Both must exist BEFORE Gradle
#   assembles the APK. AGP automatically includes the standard jniLibs and
#   assets source-set directories, so no extra Gradle config is needed here.
#   android-actions/setup-android@v3 is deliberately NOT used: it installs the
#   removed `tools` package and fails. The SDK/NDK are usually preinstalled on
#   ubuntu-latest; the NDK path is discovered below (with an sdkmanager
#   fallback when the image has no NDK).

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/keyboard/**"
      - "android/app/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/keyboard/**"
      - "android/app/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/**"
      - ".github/workflows/android-apk.yml"
  # Manual runs are handy for testing a release candidate without pushing a tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    # ubuntu-latest already ships an Android SDK; do not use setup-android@v3
    # (it tries to install the removed `tools` package and fails).
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # Do not use `cache: gradle` here: gradle/actions/setup-gradle@v4
          # already caches Gradle User Home and warns about double caching.

      - name: Accept licenses and install Android SDK 36
        run: |
          set -euo pipefail
          SDKMGR=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMGR="$(command -v sdkmanager)"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            # Runners sometimes only expose a versioned cmdline-tools folder.
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -mindepth 3 -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            echo "::error::sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"

      # --- Bundled local AI model -------------------------------------------
      - name: Set up Python for model conversion
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned model conversion dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Prefer the exact pins shipped with the converter when available.
          # The inline fallback below is fully pinned; update it whenever the
          # converter adds or changes an import (see android/keyboard/VERIFY_BUILD.md).
          REQ="tools/convert_grammar-requirements.txt"
          if [ -f "$REQ" ]; then
            echo "Installing converter requirements from $REQ"
            python -m pip install -r "$REQ"
          else
            # Pins matched to litert-torch 0.10.0: torch<2.15, ai-edge-litert<2.4;
            # litert-quantizer 0.11.0 pins ai-edge-litert==2.3.0. CPU torch avoids
            # multi-GB CUDA wheels; fall back to PyPI if the CPU index is unavailable.
            python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.0" \
              || python -m pip install "torch==2.14.0"
            python -m pip install \
              "numpy==1.26.4" \
              "transformers==4.48.3" \
              "huggingface-hub==0.34.4" \
              "safetensors==0.5.2" \
              "sentencepiece==0.2.0" \
              "ai-edge-litert==2.3.0" \
              "litert-torch==0.10.0" \
              "litert-quantizer==0.11.0"
          fi

      - name: Bundle the local grammar model (.tflite)
        run: |
          set -euo pipefail
          SCRIPT="tools/convert_grammar_model.py"
          OUT="android/keyboard/app/src/main/assets/models"
          if [ ! -f "$SCRIPT" ]; then
            echo "::error title=Model conversion::Missing $SCRIPT - the v0.1.4 keyboard cannot be built without its bundled AI model."
            exit 1
          fi
          mkdir -p "$OUT"
          echo "Converting pszemraj/grammar-synthesis-small to a quantized .tflite (public model, no HF token needed)..."
          python "$SCRIPT"
          count="$(find "$OUT" -type f -name '*.tflite' -size +0c 2>/dev/null | wc -l)"
          if [ "${count:-0}" -eq 0 ]; then
            echo "::error title=Model conversion::No non-empty .tflite was generated in $OUT - refusing to build an APK without the model."
            exit 1
          fi
          echo "Bundled $count non-empty .tflite model file(s):"
          find "$OUT" -type f -name '*.tflite' -printf '%p (%s bytes)\n'

      # --- Rust/OpenPGP crypto bridge ---------------------------------------
      - name: Install Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          # cargo-ndk maps these to aarch64/armv7/x86_64-linux-android.
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Discover Android NDK
        run: |
          set -euo pipefail
          # An installed NDK is a directory with source.properties (and/or the
          # legacy ndk-build script). A bare directory named "ndk*" is not
          # enough - cmdline-tools and other SDK bits can match that pattern.
          valid_ndk() {
            [ -d "$1" ] || return 1
            [ -f "$1/source.properties" ] || [ -x "$1/ndk-build" ] || return 1
            return 0
          }

          # Every GitHub `run:` block is a fresh shell: the SDKMGR discovered by
          # the earlier "Accept licenses..." step does NOT survive into this
          # step, so discover it here instead of assuming a cross-step variable.
          # Pass "quiet" for a best-effort probe that emits no ::error; the
          # install path calls it without "quiet" and fails only if all fail.
          find_sdkmanager() {
            local quiet="${1:-}"
            local sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            local candidate
            SDKMGR=""
            # 1) PATH (sdkmanager is often not on PATH on hosted runners).
            if command -v sdkmanager >/dev/null 2>&1; then
              candidate="$(command -v sdkmanager)"
              if [ -n "$candidate" ] && [ -x "$candidate" ]; then SDKMGR="$candidate"; fi
            fi
            # 2) The location actually seen in CI.
            if [ -z "$SDKMGR" ] && [ -n "$sdk" ] && [ -x "$sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMGR="$sdk/cmdline-tools/latest/bin/sdkmanager"
            fi
            # 3) Versioned cmdline-tools folders (e.g. cmdline-tools/16.0/bin).
            if [ -z "$SDKMGR" ] && [ -n "$sdk" ] && [ -d "$sdk/cmdline-tools" ]; then
              candidate="$(find "$sdk/cmdline-tools" -mindepth 3 -maxdepth 4 -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
              if [ -n "$candidate" ] && [ -x "$candidate" ]; then SDKMGR="$candidate"; fi
            fi
            # 4) Legacy SDK layout.
            if [ -z "$SDKMGR" ] && [ -n "$sdk" ] && [ -x "$sdk/tools/bin/sdkmanager" ]; then
              SDKMGR="$sdk/tools/bin/sdkmanager"
            fi
            if [ -z "$SDKMGR" ]; then
              if [ "$quiet" != "quiet" ]; then
                echo "::error title=Android NDK::No Android NDK found and sdkmanager is unavailable - the Rust crypto bridge cannot be built. Checked PATH, ${sdk:-<unset>}/cmdline-tools/latest, versioned cmdline-tools dirs, and ${sdk:-<unset>}/tools/bin."
              fi
              return 1
            fi
            echo "Using sdkmanager: $SDKMGR"
          }

          NDK=""
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMGR=""

          # Re-runnable discovery so we can look again after installing an NDK.
          discover_ndk() {
            local candidate
            NDK=""
            # 1) Newest side-by-side NDK under $ANDROID_HOME/ndk.
            if [ -n "$SDK" ] && [ -d "$SDK/ndk" ]; then
              candidate="$(find "$SDK/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1 || true)"
              if valid_ndk "$candidate"; then NDK="$candidate"; return 0; fi
            fi
            # 2) Canonical env vars exported by the runner image.
            for candidate in "${ANDROID_NDK_HOME:-}" "${ANDROID_NDK_ROOT:-}" \
                             "${ANDROID_NDK:-}" "${ANDROID_NDK_LATEST_HOME:-}"; do
              if valid_ndk "$candidate"; then NDK="$candidate"; return 0; fi
            done
            # 3) Legacy ndk-bundle or any other NDK-shaped dir under the SDK.
            if [ -n "$SDK" ] && [ -d "$SDK" ]; then
              while IFS= read -r candidate; do
                if valid_ndk "$candidate"; then NDK="$candidate"; return 0; fi
              done < <(find "$SDK" -maxdepth 3 -type d -name 'ndk*' 2>/dev/null | sort -V -r || true)
            fi
            return 1
          }

          # Populate SDKMGR for downstream steps without failing when a
          # preinstalled NDK makes sdkmanager unnecessary.
          find_sdkmanager quiet || true
          discover_ndk || true

          # 4) Nothing preinstalled: fetch a known-good NDK with sdkmanager.
          if [ -z "$NDK" ]; then
            echo "No preinstalled Android NDK found; installing one via sdkmanager."
            find_sdkmanager
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            for ver in 27.2.12479018 27.3.13750724 26.3.11579264; do
              echo "Installing ndk;$ver ..."
              yes | "$SDKMGR" "ndk;$ver" > /dev/null 2>&1 || true
              # Re-run discovery: the NDK may not land at $SDK/ndk/$ver.
              discover_ndk || true
              if [ -n "$NDK" ]; then break; fi
            done
            if [ -z "$NDK" ]; then
              echo "::error title=Android NDK::sdkmanager could not install any known Android NDK - the Rust crypto bridge cannot be built."
              exit 1
            fi
            echo "::notice title=Android NDK::Installed NDK at $NDK"
          fi

          echo "Using Android NDK: $NDK"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "SDKMGR=$SDKMGR" >> "$GITHUB_ENV"

      - name: Build Rust crypto bridge for Android ABIs
        run: |
          set -euo pipefail
          LIBDIR="android/keyboard/app/build/newpgp/jniLibs"
          RUST_TARGET_DIR="crates/newpgp-mobile/target"
          # newpgp-mobile is its own workspace root, so point cargo at its
          # manifest and make the target dir explicit: CMake imports the Rust
          # staticlib from exactly this directory (NEWPGP_RUST_TARGET_DIR).
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o "$LIBDIR" build --release \
            --manifest-path crates/newpgp-mobile/Cargo.toml \
            --target-dir "$RUST_TARGET_DIR" -p newpgp-mobile

          # cargo-ndk writes the cdylib .so into $LIBDIR/<abi>, but the APK's
          # libnewpgp_mobile.so is produced by CMake (C++ JNI shim + Rust
          # staticlib). Accept either output: a non-empty .so from cargo-ndk,
          # OR the staticlib CMake imports. Never fail the job just because the
          # intermediate cdylib was not copied into $LIBDIR.
          for abi in arm64-v8a armeabi-v7a x86_64; do
            case "$abi" in
              arm64-v8a) triple="aarch64-linux-android" ;;
              armeabi-v7a) triple="armv7-linux-androideabi" ;;
              x86_64) triple="x86_64-linux-android" ;;
            esac
            found=""
            for name in libnewpgp_mobile.so libnewpgp_jni.so; do
              if [ -s "$LIBDIR/$abi/$name" ]; then found="$name"; break; fi
            done
            if [ -n "$found" ]; then
              echo "Prepared $LIBDIR/$abi/$found ($(stat -c%s "$LIBDIR/$abi/$found") bytes)"
              continue
            fi
            # Exact cargo target dir for this triple (same as --target-dir above).
            STATIC="crates/newpgp-mobile/target/$triple/release/libnewpgp_mobile.a"
            if [ -s "$STATIC" ]; then
              echo "::notice title=Native bridge::No cargo-ndk cdylib in $LIBDIR/$abi, but the CMake static lib $STATIC ($(stat -c%s "$STATIC") bytes) is present - Gradle/CMake will produce the packaged libnewpgp_mobile.so."
              continue
            fi
            echo "::error title=Native bridge::Neither a native library in $LIBDIR/$abi nor the CMake static lib $STATIC exists for $abi - the APK cannot include the Rust bridge."
            exit 1
          done

      - uses: gradle/actions/setup-gradle@v4
        with:
          # No wrapper JAR is committed, so put a known-compatible Gradle on
          # PATH for the `gradle assembleDebug` fallback below.
          gradle-version: "8.13"

      - name: Assemble debug APK
        working-directory: android/keyboard
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Run keyboard unit tests
        working-directory: android/keyboard
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:testDebugUnitTest
          else
            gradle :app:testDebugUnitTest
          fi

      - name: Upload keyboard test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newpgp-keyboard-tests
          path: android/keyboard/app/build/test-results/**/*.xml
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: newpgp-keyboard-debug
          path: android/keyboard/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  app-debug:
    name: Build companion app debug APK
    runs-on: ubuntu-latest
    # Same SDK setup as the keyboard job; the companion app is a separate
    # Gradle root at android/app (module: android/app/app). It does not use
    # the native bridge or the AI model, so no cargo-ndk step is needed here.
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # caching is handled by gradle/actions/setup-gradle@v4 below

      - name: Accept licenses and install Android SDK 36
        run: |
          set -euo pipefail
          SDKMGR=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMGR="$(command -v sdkmanager)"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            # Runners sometimes only expose a versioned cmdline-tools folder.
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -mindepth 3 -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            echo "::error::sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # No wrapper JAR is committed, so put a known-compatible Gradle on
          # PATH for the `gradle assembleDebug` fallback below.
          gradle-version: "8.13"

      - name: Assemble companion app debug APK
        working-directory: android/app
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Run companion app unit tests
        working-directory: android/app
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:testDebugUnitTest
          else
            gradle :app:testDebugUnitTest
          fi

      - name: Upload companion app test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newpgp-android-app-tests
          path: android/app/app/build/test-results/**/*.xml
          if-no-files-found: warn

      - name: Upload companion app debug APK
        uses: actions/upload-artifact@v4
        with:
          name: newpgp-android-app-debug
          path: android/app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Build signed release APK
    # Tag gate at job level. Secrets cannot be used in an `if:` expression, so
    # the signing-secret gate is a job-level env var checked by each step.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NEWPGP_KEYSTORE_BASE64: ${{ secrets.NEWPGP_KEYSTORE_BASE64 }}
      NEWPGP_KEYSTORE_PASSWORD: ${{ secrets.NEWPGP_KEYSTORE_PASSWORD }}
      NEWPGP_KEY_ALIAS: ${{ secrets.NEWPGP_KEY_ALIAS }}
      NEWPGP_KEY_PASSWORD: ${{ secrets.NEWPGP_KEY_PASSWORD }}
      SIGNING_READY: ${{ secrets.NEWPGP_KEYSTORE_BASE64 != '' && secrets.NEWPGP_KEYSTORE_PASSWORD != '' && secrets.NEWPGP_KEY_ALIAS != '' && secrets.NEWPGP_KEY_PASSWORD != '' }}
    steps:
      - name: Skip release when signing secrets are not configured
        if: env.SIGNING_READY != 'true'
        run: |
          echo "::notice title=Signed release skipped::Signing secrets are not configured; signed release APKs are not yet available. Normal tag builds still pass; release-all.yml publishes the unsigned debug APKs."

      - uses: actions/checkout@v4
        if: env.SIGNING_READY == 'true'

      - uses: actions/setup-java@v4
        if: env.SIGNING_READY == 'true'
        with:
          distribution: temurin
          java-version: "17"
          # Do not use `cache: gradle` here: gradle/actions/setup-gradle@v4
          # already caches Gradle User Home and warns about double caching.

      - name: Accept licenses and install Android SDK 36
        if: env.SIGNING_READY == 'true'
        run: |
          set -euo pipefail
          SDKMGR=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMGR="$(command -v sdkmanager)"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -mindepth 3 -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            echo "::error::sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"

      # The signed APK must contain the same native bridge and model as debug.
      - name: Set up Python for model conversion
        if: env.SIGNING_READY == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned model conversion dependencies
        if: env.SIGNING_READY == 'true'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          REQ="tools/convert_grammar-requirements.txt"
          if [ -f "$REQ" ]; then
            echo "Installing converter requirements from $REQ"
            python -m pip install -r "$REQ"
          else
            python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.0" \
              || python -m pip install "torch==2.14.0"
            python -m pip install \
              "numpy==1.26.4" \
              "transformers==4.48.3" \
              "huggingface-hub==0.34.4" \
              "safetensors==0.5.2" \
              "sentencepiece==0.2.0" \
              "ai-edge-litert==2.3.0" \
              "litert-torch==0.10.0" \
              "litert-quantizer==0.11.0"
          fi

      - name: Bundle the local grammar model (.tflite)
        if: env.SIGNING_READY == 'true'
        run: |
          set -euo pipefail
          SCRIPT="tools/convert_grammar_model.py"
          OUT="android/keyboard/app/src/main/assets/models"
          if [ ! -f "$SCRIPT" ]; then
            echo "::error title=Model conversion::Missing $SCRIPT - the v0.1.4 keyboard cannot be built without its bundled AI model."
            exit 1
          fi
          mkdir -p "$OUT"
          python "$SCRIPT"
          count="$(find "$OUT" -type f -name '*.tflite' -size +0c 2>/dev/null | wc -l)"
          if [ "${count:-0}" -eq 0 ]; then
            echo "::error title=Model conversion::No non-empty .tflite was generated in $OUT - refusing to build an APK without the model."
            exit 1
          fi
          echo "Bundled $count non-empty .tflite model file(s):"
          find "$OUT" -type f -name '*.tflite' -printf '%p (%s bytes)\n'

      - name: Install Rust toolchain with Android targets
        if: env.SIGNING_READY == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        if: env.SIGNING_READY == 'true'
        run: cargo install cargo-ndk --locked

      - name: Discover Android NDK
        if: env.SIGNING_READY == 'true'
        run: |
          set -euo pipefail
          # An installed NDK is a directory with source.properties (and/or the
          # legacy ndk-build script). A bare directory named "ndk*" is not
          # enough - cmdline-tools and other SDK bits can match that pattern.
          valid_ndk() {
            [ -d "$1" ] || return 1
            [ -f "$1/source.properties" ] || [ -x "$1/ndk-build" ] || return 1
            return 0
          }

          # Every GitHub `run:` block is a fresh shell: the SDKMGR discovered by
          # the earlier "Accept licenses..." step does NOT survive into this
          # step, so discover it here instead of assuming a cross-step variable.
          # Pass "quiet" for a best-effort probe that emits no ::error; the
          # install path calls it without "quiet" and fails only if all fail.
          find_sdkmanager() {
            local quiet="${1:-}"
            local sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            local candidate
            SDKMGR=""
            # 1) PATH (sdkmanager is often not on PATH on hosted runners).
            if command -v sdkmanager >/dev/null 2>&1; then
              candidate="$(command -v sdkmanager)"
              if [ -n "$candidate" ] && [ -x "$candidate" ]; then SDKMGR="$candidate"; fi
            fi
            # 2) The location actually seen in CI.
            if [ -z "$SDKMGR" ] && [ -n "$sdk" ] && [ -x "$sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMGR="$sdk/cmdline-tools/latest/bin/sdkmanager"
            fi
            # 3) Versioned cmdline-tools folders (e.g. cmdline-tools/16.0/bin).
            if [ -z "$SDKMGR" ] && [ -n "$sdk" ] && [ -d "$sdk/cmdline-tools" ]; then
              candidate="$(find "$sdk/cmdline-tools" -mindepth 3 -maxdepth 4 -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
              if [ -n "$candidate" ] && [ -x "$candidate" ]; then SDKMGR="$candidate"; fi
            fi
            # 4) Legacy SDK layout.
            if [ -z "$SDKMGR" ] && [ -n "$sdk" ] && [ -x "$sdk/tools/bin/sdkmanager" ]; then
              SDKMGR="$sdk/tools/bin/sdkmanager"
            fi
            if [ -z "$SDKMGR" ]; then
              if [ "$quiet" != "quiet" ]; then
                echo "::error title=Android NDK::No Android NDK found and sdkmanager is unavailable - the Rust crypto bridge cannot be built. Checked PATH, ${sdk:-<unset>}/cmdline-tools/latest, versioned cmdline-tools dirs, and ${sdk:-<unset>}/tools/bin."
              fi
              return 1
            fi
            echo "Using sdkmanager: $SDKMGR"
          }

          NDK=""
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMGR=""

          # Re-runnable discovery so we can look again after installing an NDK.
          discover_ndk() {
            local candidate
            NDK=""
            # 1) Newest side-by-side NDK under $ANDROID_HOME/ndk.
            if [ -n "$SDK" ] && [ -d "$SDK/ndk" ]; then
              candidate="$(find "$SDK/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1 || true)"
              if valid_ndk "$candidate"; then NDK="$candidate"; return 0; fi
            fi
            # 2) Canonical env vars exported by the runner image.
            for candidate in "${ANDROID_NDK_HOME:-}" "${ANDROID_NDK_ROOT:-}" \
                             "${ANDROID_NDK:-}" "${ANDROID_NDK_LATEST_HOME:-}"; do
              if valid_ndk "$candidate"; then NDK="$candidate"; return 0; fi
            done
            # 3) Legacy ndk-bundle or any other NDK-shaped dir under the SDK.
            if [ -n "$SDK" ] && [ -d "$SDK" ]; then
              while IFS= read -r candidate; do
                if valid_ndk "$candidate"; then NDK="$candidate"; return 0; fi
              done < <(find "$SDK" -maxdepth 3 -type d -name 'ndk*' 2>/dev/null | sort -V -r || true)
            fi
            return 1
          }

          # Populate SDKMGR for downstream steps without failing when a
          # preinstalled NDK makes sdkmanager unnecessary.
          find_sdkmanager quiet || true
          discover_ndk || true

          # 4) Nothing preinstalled: fetch a known-good NDK with sdkmanager.
          if [ -z "$NDK" ]; then
            echo "No preinstalled Android NDK found; installing one via sdkmanager."
            find_sdkmanager
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            for ver in 27.2.12479018 27.3.13750724 26.3.11579264; do
              echo "Installing ndk;$ver ..."
              yes | "$SDKMGR" "ndk;$ver" > /dev/null 2>&1 || true
              # Re-run discovery: the NDK may not land at $SDK/ndk/$ver.
              discover_ndk || true
              if [ -n "$NDK" ]; then break; fi
            done
            if [ -z "$NDK" ]; then
              echo "::error title=Android NDK::sdkmanager could not install any known Android NDK - the Rust crypto bridge cannot be built."
              exit 1
            fi
            echo "::notice title=Android NDK::Installed NDK at $NDK"
          fi

          echo "Using Android NDK: $NDK"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "SDKMGR=$SDKMGR" >> "$GITHUB_ENV"

      - name: Build Rust crypto bridge for Android ABIs
        if: env.SIGNING_READY == 'true'
        run: |
          set -euo pipefail
          LIBDIR="android/keyboard/app/build/newpgp/jniLibs"
          RUST_TARGET_DIR="crates/newpgp-mobile/target"
          # newpgp-mobile is its own workspace root, so point cargo at its
          # manifest and make the target dir explicit: CMake imports the Rust
          # staticlib from exactly this directory (NEWPGP_RUST_TARGET_DIR).
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o "$LIBDIR" build --release \
            --manifest-path crates/newpgp-mobile/Cargo.toml \
            --target-dir "$RUST_TARGET_DIR" -p newpgp-mobile

          # cargo-ndk writes the cdylib .so into $LIBDIR/<abi>, but the APK's
          # libnewpgp_mobile.so is produced by CMake (C++ JNI shim + Rust
          # staticlib). Accept either output: a non-empty .so from cargo-ndk,
          # OR the staticlib CMake imports. Never fail the job just because the
          # intermediate cdylib was not copied into $LIBDIR.
          for abi in arm64-v8a armeabi-v7a x86_64; do
            case "$abi" in
              arm64-v8a) triple="aarch64-linux-android" ;;
              armeabi-v7a) triple="armv7-linux-androideabi" ;;
              x86_64) triple="x86_64-linux-android" ;;
            esac
            found=""
            for name in libnewpgp_mobile.so libnewpgp_jni.so; do
              if [ -s "$LIBDIR/$abi/$name" ]; then found="$name"; break; fi
            done
            if [ -n "$found" ]; then
              echo "Prepared $LIBDIR/$abi/$found ($(stat -c%s "$LIBDIR/$abi/$found") bytes)"
              continue
            fi
            # Exact cargo target dir for this triple (same as --target-dir above).
            STATIC="crates/newpgp-mobile/target/$triple/release/libnewpgp_mobile.a"
            if [ -s "$STATIC" ]; then
              echo "::notice title=Native bridge::No cargo-ndk cdylib in $LIBDIR/$abi, but the CMake static lib $STATIC ($(stat -c%s "$STATIC") bytes) is present - Gradle/CMake will produce the packaged libnewpgp_mobile.so."
              continue
            fi
            echo "::error title=Native bridge::Neither a native library in $LIBDIR/$abi nor the CMake static lib $STATIC exists for $abi - the APK cannot include the Rust bridge."
            exit 1
          done

      - uses: gradle/actions/setup-gradle@v4
        if: env.SIGNING_READY == 'true'
        with:
          gradle-version: "8.13"

      - name: Decode signing keystore
        if: env.SIGNING_READY == 'true'
        working-directory: android/keyboard
        run: |
          set -euo pipefail
          echo "$NEWPGP_KEYSTORE_BASE64" | base64 --decode > app/newpgp-release.jks

      - name: Assemble signed release APK
        if: env.SIGNING_READY == 'true'
        working-directory: android/keyboard
        # Gradle maps ORG_GRADLE_PROJECT_* env vars to project properties;
        # app/build.gradle.kts only uses them when all four are present.
        env:
          ORG_GRADLE_PROJECT_NEWPGP_UPLOAD_STORE_FILE: app/newpgp-release.jks
          ORG_GRADLE_PROJECT_NEWPGP_UPLOAD_STORE_PASSWORD: ${{ env.NEWPGP_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_NEWPGP_UPLOAD_KEY_ALIAS: ${{ env.NEWPGP_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_NEWPGP_UPLOAD_KEY_PASSWORD: ${{ env.NEWPGP_KEY_PASSWORD }}
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      - name: Upload signed release APK
        if: env.SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: newpgp-keyboard-release
          path: android/keyboard/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # No `softprops/action-gh-release` here: release-all.yml is the only
      # workflow allowed to create/modify a GitHub release, and only once all
      # required builds have succeeded for the tagged commit.
