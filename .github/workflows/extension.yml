name: Browser Extension

on:
  push:
    branches: [main]
    paths:
      - "extensions/browser/**"
      - ".github/workflows/extension.yml"
  pull_request:
    branches: [main]
    paths:
      - "extensions/browser/**"
      - ".github/workflows/extension.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: extensions/browser

jobs:
  build:
    name: Check, test and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extensions/browser/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Assumes the packaging step outputs a zip in extensions/browser/dist.
      - name: Upload packaged extension
        uses: actions/upload-artifact@v4
        with:
          name: newpgp-browser-extension
          path: |
            extensions/browser/dist/*.zip
            extensions/browser/dist/*.crx
            extensions/browser/dist/*.xpi
          if-no-files-found: ignore
