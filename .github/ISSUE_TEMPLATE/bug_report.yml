name: Bug report
description: Report a problem with NewPGP
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve NewPGP!

        **Please do NOT paste private keys, passphrases, or plaintext messages into this issue.**
        Redact any sensitive data from logs and screenshots before sharing them.

  - type: input
    id: app-version
    attributes:
      label: App version
      description: "Which version of NewPGP are you using?"
      placeholder: "e.g. v0.1.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: "Where did you encounter the problem?"
      options:
        - Desktop app (Windows)
        - Desktop app (macOS)
        - Desktop app (Linux)
        - Browser extension
        - Android keyboard
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: "Describe the issue and what you expected to happen."
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: "List the steps to reproduce the problem. Do not include real private keys, passphrases, or plaintext messages."
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: "Optional: paste logs or attach screenshots with all sensitive data redacted."
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: "Anything else that might help us investigate."
