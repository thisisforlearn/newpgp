# cargo-deny policy. Run with: cargo deny check
[graph]
targets = []
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

# New code should not ship with known vulnerabilities. We keep vulnerabilities
# as warnings here so that a newly published advisory doesn't block unrelated
# CI, but the audit job reports them prominently and release owners must review.
vulnerability = "warn"
unmaintained = "warn"
unsound = "warn"
notice = "warn"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
allow-wildcard-paths = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
