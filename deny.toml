# cargo-deny policy. Run with: cargo deny check
[graph]
targets = ["all"]
all-features = false

[advisories]
version = 2
yanked = "deny"
# These advisories are acknowledged here as well as in .cargo/audit.toml so
# cargo-deny and the audit job agree. Both are TRANSITIVE dependencies of rPGP
# (`pgp` 0.21.1, the latest release): NewPGP uses only Ed25519 signing and
# X25519 encryption via rPGP, so RSA operations and the affected crypto-bigint
# constant-time operations exist solely for legacy message/key parsing and are
# not called by NewPGP. Full rationale and review conditions:
# docs/SECURITY_AUDIT.md.
ignore = [
    # crypto-bigint 0.5.5 timing variability; patched in >= 0.7.6.
    "RUSTSEC-2026-0387",
    # rsa 0.9.10 Marvin Attack (CVE-2023-49092); patched in >= 0.10.0.
    "RUSTSEC-2023-0071",
]

# New code should not ship with known vulnerabilities. We keep vulnerabilities
# as warnings here so that a newly published advisory doesn't block unrelated
# CI, but the audit job reports them prominently and release owners must review.
vulnerability = "warn"
unmaintained = "warn"
unsound = "warn"
notice = "warn"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
allow-wildcard-paths = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
